<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <!-- =========================================================
         CONFIGURAÇÕES
    ========================================================== -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Rastreamento</title>


    <!-- =========================================================
         FAVICON
    ========================================================== -->

    <link
        rel="icon"
        type="image/svg+xml"
        href="data:image/svg+xml;charset=UTF-8,
        <svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'>
            <rect width='100' height='100' rx='20' fill='%2314283D'/>
            <text
                x='50'
                y='72'
                text-anchor='middle'
                font-size='60'
            >🖥️</text>
        </svg>"
    >


    <!-- =========================================================
         CSS
    ========================================================== -->

    <link
        rel="stylesheet"
        href="rastreio_amostra.css"
    >

</head>


<body>


    <!-- =========================================================
         SIDEBAR
    ========================================================== -->

    <aside class="sidebar">

        <!-- =====================================================
             TOPO DO MENU
        ====================================================== -->

        <div class="menu-topo">

            <button
                class="btnInicio"
                onclick="window.location.href='tela_inicio.html'"
            >

                <svg
                    viewBox="0 0 24 24"
                    width="22"
                    height="22"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg"
                >

                    <!-- Telhado -->

                    <path
                        d="M3 10L12 3L21 10"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    />

                    <!-- Corpo -->

                    <path
                        d="M5 10V20H19V10"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    />

                    <!-- Porta -->

                    <path
                        d="M10 20V14H14V20"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    />

                </svg>

                <span>Início</span>

            </button>

        </div>


        <!-- =====================================================
             MENU CENTRAL
        ====================================================== -->

        <div class="menu-centro">

            <button
                class="menu-btn"
                data-tela="rastreio_amostra"
                data-link="rastreio_amostra.html"
            >
                📈 Rastreio Amostras
            </button>


            <button
                class="menu-btn"
                data-tela="rankprod"
                data-link="rankprod.html"
            >
                📈 RankProd
            </button>


            <button
                class="menu-btn"
                data-tela="retorno_amostras"
                data-link="retorno_amostras.html"
            >
                💸 Retorno de Amostras
            </button>


            <button
                class="menu-btn"
                data-tela="relatorio"
                data-link="consolidados.html"
            >
                📋 Relatório Consolidados
            </button>


            <button
                class="menu-btn"
                data-tela="analytics"
                data-link="analytics.html"
            >
                📈 Correios | Análises de Amostras
            </button>

        </div>


        <!-- =====================================================
             PARTE INFERIOR DO MENU
        ====================================================== -->

        <div class="menu-bottom">

            <button
                id="btnLogout"
                class="btn-logout"
            >

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg"
                >

                    <path
                        d="M12.9999 2C10.2385 2 7.99991 4.23858 7.99991 7C7.99991 7.55228 8.44762 8 8.99991 8C9.55219 8 9.99991 7.55228 9.99991 7C9.99991 5.34315 11.3431 4 12.9999 4H16.9999C18.6568 4 19.9999 5.34315 19.9999 7V17C19.9999 18.6569 18.6568 20 16.9999 20H12.9999C11.3431 20 9.99991 18.6569 9.99991 17C9.99991 16.4477 9.55219 16 8.99991 16C8.44762 16 7.99991 16.4477 7.99991 17C7.99991 19.7614 10.2385 22 12.9999 22H16.9999C19.7613 22 21.9999 19.7614 21.9999 17V7C21.9999 4.23858 19.7613 2 16.9999 2H12.9999Z"
                        fill="currentColor"
                    />

                    <path
                        d="M13.9999 11C14.5522 11 14.9999 11.4477 14.9999 12C14.9999 12.5523 14.5522 13 13.9999 13V11Z"
                        fill="currentColor"
                    />

                    <path
                        d="M5.71783 11C5.80685 10.8902 5.89214 10.7837 5.97282 10.682C6.21831 10.3723 6.42615 10.1004 6.57291 9.90549C6.64636 9.80795 6.70468 9.72946 6.74495 9.67492L6.79152 9.61162L6.804 9.59454L6.80842 9.58848C6.80846 9.58842 6.80892 9.58778 5.99991 9L6.80842 9.58848C7.13304 9.14167 7.0345 8.51561 6.58769 8.19098C6.14091 7.86637 5.51558 7.9654 5.19094 8.41215L5.18812 8.41602L5.17788 8.43002L5.13612 8.48679C5.09918 8.53682 5.04456 8.61033 4.97516 8.7025C4.83623 8.88702 4.63874 9.14542 4.40567 9.43937C3.93443 10.0337 3.33759 10.7481 2.7928 11.2929L2.08569 12L2.7928 12.7071C3.33759 13.2519 3.93443 13.9663 4.40567 14.5606C4.63874 14.8546 4.83623 15.113 4.97516 15.2975C5.04456 15.3897 5.09918 15.4632 5.13612 15.5132L5.17788 15.57L5.18812 15.584L5.19045 15.5872C5.51509 16.0339 6.14091 16.1336 6.58769 15.809C7.0345 15.4844 7.13355 14.859 6.80892 14.4122L5.99991 15C6.80892 14.4122 6.80897 14.4123 6.80892 14.4122L6.804 14.4055L6.79152 14.3884L6.74495 14.3251C6.70468 14.2705 6.64636 14.1921 6.57291 14.0945C6.42615 13.8996 6.21831 13.6277 5.97282 13.318C5.89214 13.2163 5.80685 13.1098 5.71783 13H13.9999V11H5.71783Z"
                        fill="currentColor"
                    />

                </svg>

                <span>Logout</span>

            </button>

        </div>

    </aside>


    <!-- =========================================================
         OVERLAY DA SIDEBAR
    ========================================================== -->

    <div class="overlay-sidebar"></div>


    <!-- =========================================================
         OVERLAY - DETALHES
    ========================================================== -->

    <div
        id="overlayDetalhes"
        class="overlay oculto"
    >

        <div class="painel-detalhes">

            <button
                class="fechar"
                onclick="fecharDetalhes()"
            >
                ✕
            </button>

            <div id="conteudoDetalhes"></div>

        </div>

    </div>


    <!-- =========================================================
         OVERLAY - NOTIFICAÇÕES
    ========================================================== -->

    <div
        id="overlayNotificacoes"
        class="overlay oculto"
    >

        <div class="painel-detalhes">

            <button
                class="fechar"
                onclick="fecharNotificacoes()"
            >
                ✕
            </button>

            <h3>Pedidos Pendentes</h3>

            <div id="listaNotificacoes"></div>

        </div>

    </div>


    <!-- =========================================================
         TOPBAR
    ========================================================== -->

    <header
        class="topbar"
        id="boxFiltros"
    >


        <!-- =====================================================
             BOTÃO MENU
        ====================================================== -->

        <button
            class="btn-menu"
            onclick="toggleMenu()"
            type="button"
        >
            ☰
        </button>


        <!-- =====================================================
             LOGO
        ====================================================== -->

        <div class="logo-topo">

            <img
                id="logoMarcaBox"
                class="logo-marca-box"
                alt="Logo"
            >

        </div>


        <!-- =====================================================
             AÇÕES DO TOPO
        ====================================================== -->

        <div class="acoes-topo">

            <div
                id="boasVindas"
                class="usuario-topo"
            ></div>


            <!-- =================================================
                 NOTIFICAÇÕES
            ================================================== -->


            <button
                id="btnNotificacoes"
                class="icone-topo oculto"
                title="Notificações"
                type="button"
                aria-label="Notificações"
            >
                <svg
                    class="icone-notificacao-svg"
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                >
                    <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"></path>
                    <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                </svg>

                <span
                    id="contadorNotificacoes"
                    class="badge"
                ></span>
            </button>


        </div>




    </header>






        <!-- =====================================================
     DASHBOARD DE STATUS
====================================================== -->
<div class="dashboard-cards">

    <!-- =====================================================
         TODOS OS ENVIOS
    ====================================================== -->
    <div
        class="card-status total"
        data-status="TOTAL"
    >
        <div class="card-top">

            <span
                class="card-valor"
                id="totalGeral"
            >
                0
            </span>

            <span class="card-icone" aria-hidden="true">
                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg"
                >
                    <path
                        d="M4 19V5"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                    />
                    <path
                        d="M4 19H20"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                    />
                    <path
                        d="M7 15L11 11L14 14L20 7"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    />
                    <path
                        d="M16 7H20V11"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    />
                </svg>
            </span>

        </div>

        <div class="card-label">
            Todos Envios
        </div>

        <div
            class="card-extra"
            id="enviosUltimos30Dias"
        >
            0 nos últimos 30 dias
        </div>
    </div>


    <!-- =====================================================
         ENTREGUES
    ====================================================== -->
    <div
        class="card-status entregue"
        data-status="ENTREGUE"
    >
        <div class="card-top">

            <span
                class="card-valor"
                id="totalEntregues"
            >
                0
            </span>

            <span class="card-icone" aria-hidden="true">
                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg"
                >
                    <path
                        d="M20 6L9 17L4 12"
                        stroke="currentColor"
                        stroke-width="2.2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    />
                </svg>
            </span>

        </div>

        <div class="card-label">
            Entregues
        </div>

        <div
            class="card-extra"
            id="entreguesUltimos30Dias"
        >
            0 nos últimos 30 dias
        </div>
    </div>


    <!-- =====================================================
         PENDENTES
    ====================================================== -->
    <div
        class="card-status pendente"
        data-status="PENDENTE"
    >
        <div class="card-top">

            <span
                class="card-valor"
                id="totalPendentes"
            >
                0
            </span>

            <span class="card-icone" aria-hidden="true">
                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg"
                >
                    <circle
                        cx="12"
                        cy="12"
                        r="8"
                        stroke="currentColor"
                        stroke-width="2"
                    />

                    <path
                        d="M12 8V12L15 14"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    />
                </svg>
            </span>

        </div>

        <div class="card-label">
            Pendentes
        </div>

        <div
            class="card-extra"
            id="pendentesUltimos30Dias"
        >
            0 nos últimos 30 dias
        </div>
    </div>


    <!-- =====================================================
         RETORNADOS
    ====================================================== -->
    <div
        class="card-status retornou"
        data-status="RETORN"
    >
        <div class="card-top">

            <span
                class="card-valor"
                id="totalRetornados"
            >
                0
            </span>

            <span class="card-icone" aria-hidden="true">
                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg"
                >
                    <path
                        d="M9 7L4 12L9 17"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    />

                    <path
                        d="M4 12H14"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                    />

                    <path
                        d="M14 7H17C18.66 7 20 8.34 20 10V14C20 15.66 18.66 17 17 17H14"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                    />
                </svg>
            </span>

        </div>

        <div class="card-label">
            Retornados
        </div>

        <div
            class="card-extra"
            id="retornadosUltimos30Dias"
        >
            0 nos últimos 30 dias
        </div>
    </div>

</div>

    <!-- =====================================================
         PESQUISA
         Fica diretamente abaixo dos cards de status
    ====================================================== -->

    <div class="area-pesquisa-corporativa">

<div class="filtros-topo">

                <div class="campo-busca-wrapper">

                        <div class="icone-pesquisa">

                            <svg
                                    viewBox="0 0 24 24"
                                    width="20"
                                    height="20"
                                    fill="none"
                                    xmlns="http://www.w3.org/2000/svg"
                            >

                                    <circle
                                        cx="11"
                                        cy="11"
                                        r="7"
                                        stroke="currentColor"
                                        stroke-width="2"
                                    />

                                    <path
                                        d="M16.5 16.5L21 21"
                                        stroke="currentColor"
                                        stroke-width="2"
                                        stroke-linecap="round"
                                    />

                            </svg>

                        </div>


                        <button
                            id="btnTipoBusca"
                            class="btn-tipo-busca"
                            type="button"
                        >

                            <span id="labelTipoBusca">
                                    Nota Fiscal
                            </span>

                            <svg
                                    class="seta-busca"
                                    viewBox="0 0 24 24"
                                    width="16"
                                    height="16"
                                    fill="none"
                                    xmlns="http://www.w3.org/2000/svg"
                            >

                                    <path
                                        d="M6 9L12 15L18 9"
                                        stroke="currentColor"
                                        stroke-width="2"
                                        stroke-linecap="round"
                                        stroke-linejoin="round"
                                    />

                            </svg>

                        </button>


                        <div
                            id="menuTipoBusca"
                            class="menu-tipo-busca oculto"
                        >

                            <div
                                    class="menu-item"
                                    data-tipo="nota"
                            >

                                    <span class="menu-icone">
                                        NF
                                    </span>

                                    <span>
                                        Nota Fiscal
                                    </span>

                            </div>


                            <div
                                    class="menu-item"
                                    data-tipo="pedido"
                            >

                                    <span class="menu-icone">
                                        PD
                                    </span>

                                    <span>
                                        Pedido
                                    </span>

                            </div>


                            <div
                                    class="menu-item"
                                    data-tipo="cliente"
                            >

                                    <span class="menu-icone">
                                        CL
                                    </span>

                                    <span>
                                        Cliente
                                    </span>

                            </div>


                            <div
                                    class="menu-item"
                                    data-tipo="representante"
                            >

                                    <span class="menu-icone">
                                        RP
                                    </span>

                                    <span>
                                        Representante
                                    </span>

                            </div>

                        </div>


                        <div class="separador-busca"></div>


                        <input
                            id="filtroBusca"
                            type="text"
                            placeholder="Buscar por Nota Fiscal"
                            autocomplete="off"
                        >


                        <button
                            id="btnLimparBusca"
                            class="btn-limpar-busca"
                            type="button"
                            title="Limpar pesquisa"
                            aria-label="Limpar pesquisa"
                        >

                            <svg
                                    viewBox="0 0 24 24"
                                    width="18"
                                    height="18"
                                    fill="none"
                                    xmlns="http://www.w3.org/2000/svg"
                            >

                                    <path
                                        d="M6 6L18 18"
                                        stroke="currentColor"
                                        stroke-width="2"
                                        stroke-linecap="round"
                                    />

                                    <path
                                        d="M18 6L6 18"
                                        stroke="currentColor"
                                        stroke-width="2"
                                        stroke-linecap="round"
                                    />

                            </svg>

                        </button>

                </div>

            </div>

    </div>



    <!-- =========================================================
         RESULTADOS
    ========================================================== -->

    <section
        id="resultado"
        class="lista-cards"
    ></section>


    <!-- =========================================================
         ALERTA NA TELA
    ========================================================== -->

    <div
        id="alertaTela"
        class="alerta-tela oculto"
    ></div>


    <!-- =========================================================
         SCRIPTS
    ========================================================== -->

    <script
        src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"
    ></script>

    <script
        src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"
    ></script>

    <script
        src="rastreio_amostra.js"
    ></script>

</body>

</html>
