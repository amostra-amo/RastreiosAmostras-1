<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <!-- Ícone da aba do navegador: Login + Rastreio -->
    <link
        rel="icon"
        type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230b5ed7'/%3E%3Crect x='13' y='18' width='74' height='64' rx='9' fill='white'/%3E%3Ccircle cx='34' cy='39' r='10' fill='%230b5ed7'/%3E%3Cpath d='M20 58c0-8 6-13 14-13s14 5 14 13' fill='%230b5ed7'/%3E%3Crect x='55' y='31' width='21' height='5' rx='2.5' fill='%230b5ed7'/%3E%3Crect x='55' y='42' width='16' height='5' rx='2.5' fill='%230b5ed7' opacity='.65'/%3E%3Cpath d='M63 65c0-7 6-13 13-13s13 6 13 13c0 8-13 20-13 20S63 73 63 65z' fill='%230b5ed7'/%3E%3Ccircle cx='76' cy='64' r='4' fill='white'/%3E%3C/svg%3E"
    >

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Login</title>

    <link rel="stylesheet" href="tela_login.css">

</head>

<body>

<div class="login-frame">

    <!-- Moldura azul -->
    <div class="moldura moldura-azul"></div>

    <!-- Moldura bordô -->
    <div class="moldura moldura-bordo"></div>


    <!-- ================= LOGIN ================= -->

    <section id="loginVendedor" class="box-busca">

        <header class="topo">

            <img
                id="logoMarca"
                src="Imagens/Logo - Grupo 4k - Branco.png"
                class="logo"
                alt="Logo da empresa"
            />

        </header>


        <h3 style="text-align:center;color:white;font-size:20px;">
            Login do Vendedor
        </h3>


        <!-- ================= LOGIN PROTHEUS ================= -->

        <form id="formLogin">

            <div class="input-group">

                <input
                    id="usuarioLogin"
                    type="text"
                    required
                >

                <label for="usuarioLogin">
                    Usuário Protheus
                </label>

            </div>


            <div class="input-group">

                <input
                    id="senhaLogin"
                    type="password"
                    required
                >

                <label for="senhaLogin">
                    Senha
                </label>


                <button
                    type="button"
                    class="toggle-senha"
                    id="toggleSenha"
                >

                    <!-- Olho aberto -->
                    <svg
                        id="iconEye"
                        xmlns="http://www.w3.org/2000/svg"
                        width="20"
                        height="20"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                    >

                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>

                        <circle
                            cx="12"
                            cy="12"
                            r="3"
                        />

                    </svg>


                    <!-- Olho fechado -->
                    <svg
                        id="iconEyeOff"
                        xmlns="http://www.w3.org/2000/svg"
                        width="20"
                        height="20"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        style="display:none;"
                    >

                        <path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a21.77 21.77 0 0 1 5.06-5.94"/>

                        <path d="M1 1l22 22"/>

                    </svg>

                </button>

            </div>


            <button
                id="btnEntrarLogin"
                type="submit"
            >
                Entrar
            </button>


            <div id="erroLogin"></div>

        </form>


        <!-- ================= SEPARADOR ================= -->

        <div class="separador-login">

            <span>OU</span>

        </div>


        <!-- ================= ACESSO POR CÓDIGO ================= -->

        <div id="acessoCodigoVendedor">

            <h4>
                Acesso por código de vendedor
            </h4>


            <div class="input-group">

                <input
                    id="codigoVendedorLogin"
                    type="text"
                    autocomplete="off"
                >

                <label for="codigoVendedorLogin">
                    Código do vendedor
                </label>

            </div>


            <button
                id="btnAcessarCodigo"
                type="button"
            >
                Acessar por código
            </button>


            <div id="erroCodigoVendedor"></div>

        </div>

    </section>

</div>


<script src="config.js"></script>

<script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>

<script src="tela_login.js"></script>

</body>

</html>
